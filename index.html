<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafío Matemático en Familia</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-indigo-50 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl overflow-hidden p-6">
        
        <!-- CABECERA -->
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-indigo-700">🏆 Desafío Matemático</h1>
            <p class="text-sm text-gray-500 mt-1">1º ESO • Liga Semanal</p>
        </div>

        <!-- PANTALLA 1: SELECCIÓN Y CLASIFICACIÓN -->
        <div id="screen-home" class="space-y-6">
            
            <!-- CREAR / SELECCIONAR JUGADOR -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Añadir o seleccionar jugador:</label>
                <form onsubmit="addPlayer(event)" class="flex gap-2 mb-3">
                    <input type="text" id="new-player-input" placeholder="Nombre..." maxlength="15" required
                        class="flex-1 px-3 py-2 border-2 border-indigo-200 rounded-xl focus:outline-none focus:border-indigo-600 text-sm">
                    <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-4 py-2 rounded-xl text-sm transition">
                        + Añadir
                    </button>
                </form>

                <div id="players-list" class="grid grid-cols-2 gap-2 max-h-36 overflow-y-auto p-1">
                    <!-- Se llena dinámicamente -->
                </div>
            </div>

            <!-- BOTÓN JUGAR -->
            <div id="start-section" class="hidden">
                <button onclick="startGame()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-xl shadow-lg transition transform active:scale-95">
                    ¡Comenzar Reto con <span id="selected-player-name"></span>! 🚀
                </button>
            </div>

            <!-- RANKING Y ESTADÍSTICAS SEMANALES -->
            <div class="bg-indigo-50 rounded-xl p-4 mt-4">
                <h3 class="text-sm font-bold text-indigo-800 uppercase tracking-wider mb-3">Ranking Semanal (Suma de mejores días)</h3>
                <div id="leaderboard" class="space-y-3">
                    <!-- Tarjetas de jugadores con desglose -->
                </div>
                
                <div class="flex justify-between items-center mt-4 pt-3 border-t border-indigo-100">
                    <button onclick="resetWeeklyScores()" class="text-xs text-red-500 hover:underline">Reiniciar semana</button>
                    <button onclick="clearAllData()" class="text-xs text-gray-400 hover:underline">Borrar todo</button>
                </div>
            </div>
        </div>

        <!-- PANTALLA 2: JUEGO -->
        <div id="screen-game" class="hidden space-y-6">
            <div class="flex justify-between items-center bg-indigo-50 p-3 rounded-xl">
                <span id="current-player-display" class="font-bold text-indigo-900"></span>
                <span class="text-sm bg-indigo-200 text-indigo-800 px-2.5 py-1 rounded-full font-semibold">Pregunta <span id="q-count">1</span>/5</span>
            </div>

            <!-- Barra de Tiempo -->
            <div class="w-full bg-gray-200 rounded-full h-2.5">
                <div id="timer-bar" class="bg-green-500 h-2.5 rounded-full transition-all duration-1000" style="width: 100%"></div>
            </div>

            <div class="text-center py-4">
                <p class="text-xs text-gray-400 uppercase tracking-widest mb-2">Calcula el resultado</p>
                <div id="math-expression" class="text-3xl font-black text-gray-800 tracking-wider bg-gray-50 py-4 rounded-xl border border-gray-100">
                    <!-- Expresión -->
                </div>
            </div>

            <form onsubmit="submitAnswer(event)" class="space-y-4">
                <input type="number" id="answer-input" step="any" required placeholder="Tu respuesta..." 
                    class="w-full text-center text-2xl font-bold p-3 border-2 border-indigo-200 rounded-xl focus:outline-none focus:border-indigo-600">
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-xl shadow-lg transition">
                    Comprobar
                </button>
            </form>
        </div>

        <!-- PANTALLA 3: RESULTADO DE LA PARTIDA -->
        <div id="screen-result" class="hidden text-center space-y-6 py-2">
            <div class="text-5xl">🎉</div>
            <h2 class="text-xl font-bold text-gray-800">¡Ronda terminada!</h2>
            
            <div class="bg-indigo-50 p-4 rounded-xl space-y-3">
                <div>
                    <p class="text-xs text-gray-500 uppercase">Puntos en esta partida</p>
                    <p id="round-score" class="text-3xl font-black text-indigo-600">0 pts</p>
                </div>
                
                <div class="grid grid-cols-2 gap-2 pt-2 border-t border-indigo-100">
                    <div class="bg-green-100 text-green-800 p-2 rounded-lg font-bold text-sm">
                        ✅ Aciertos: <span id="round-hits">0</span>
                    </div>
                    <div class="bg-red-100 text-red-800 p-2 rounded-lg font-bold text-sm">
                        ❌ Fallos: <span id="round-misses">0</span>
                    </div>
                </div>

                <div id="new-high-score-badge" class="hidden bg-yellow-100 text-yellow-800 text-xs font-bold p-2 rounded-lg mt-2">
                    🌟 ¡Nuevo récord personal del día!
                </div>
            </div>

            <button onclick="backToHome()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-xl shadow-lg transition">
                Volver al Menú
            </button>
        </div>

    </div>

    <!-- SCRIPT DE LÓGICA -->
    <script>
        const DAYS_OF_WEEK = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'];

        let selectedPlayer = null;
        let currentScore = 0;
        let hits = 0;
        let misses = 0;
        let questionCount = 0;
        let currentAnswer = 0;
        let timer = null;
        let timeLeft = 30;

        // Estructura de datos:
        // player -> { dailyScores: [0,0,0,0,0,0,0], hits: 0, misses: 0 }
        let playersData = JSON.parse(localStorage.getItem('math_family_v3')) || {};

        renderPlayersList();
        updateLeaderboard();

        // Obtener índice del día de la semana (0: Lunes, 6: Domingo)
        function getTodayIndex() {
            const day = new Date().getDay();
            return day === 0 ? 6 : day - 1; // Convertir domingo (0) en índice 6
        }

        function addPlayer(e) {
            e.preventDefault();
            const input = document.getElementById('new-player-input');
            const name = input.value.trim();

            if (name && !(name in playersData)) {
                playersData[name] = {
                    dailyScores: [0, 0, 0, 0, 0, 0, 0],
                    hits: 0,
                    misses: 0
                };
                saveData();
                renderPlayersList();
                updateLeaderboard();
                selectPlayer(name);
                input.value = '';
            } else if (name in playersData) {
                alert('Ese jugador ya existe.');
            }
        }

        function deletePlayer(playerName, e) {
            e.stopPropagation();
            if (confirm(`¿Eliminar a ${playerName}?`)) {
                delete playersData[playerName];
                if (selectedPlayer === playerName) {
                    selectedPlayer = null;
                    document.getElementById('start-section').classList.add('hidden');
                }
                saveData();
                renderPlayersList();
                updateLeaderboard();
            }
        }

        function renderPlayersList() {
            const container = document.getElementById('players-list');
            container.innerHTML = '';

            const names = Object.keys(playersData);
            if (names.length === 0) {
                container.innerHTML = `<p class="text-xs text-gray-400 col-span-2 text-center py-2">Añade un jugador para comenzar.</p>`;
                return;
            }

            names.forEach(name => {
                const isSelected = selectedPlayer === name;
                const btn = document.createElement('div');
                btn.className = `flex justify-between items-center p-2.5 rounded-xl border-2 cursor-pointer transition text-sm font-semibold ${
                    isSelected ? 'border-indigo-600 bg-indigo-50 text-indigo-700' : 'border-gray-200 text-gray-600 hover:bg-gray-50'
                }`;
                btn.onclick = () => selectPlayer(name);
                btn.innerHTML = `
                    <span class="truncate">${name}</span>
                    <button onclick="deletePlayer('${name}', event)" class="text-gray-400 hover:text-red-500 ml-1 px-1">✕</button>
                `;
                container.appendChild(btn);
            });
        }

        function selectPlayer(name) {
            selectedPlayer = name;
            document.getElementById('selected-player-name').innerText = name;
            document.getElementById('start-section').classList.remove('hidden');
            renderPlayersList();
        }

        function startGame() {
            if (!selectedPlayer) return;
            currentScore = 0;
            hits = 0;
            misses = 0;
            questionCount = 0;
            document.getElementById('screen-home').classList.add('hidden');
            document.getElementById('screen-game').classList.remove('hidden');
            document.getElementById('current-player-display').innerText = `Jugador: ${selectedPlayer}`;
            nextQuestion();
        }

        function generateExpression() {
            const types = [1, 2, 3];
            const type = types[Math.floor(Math.random() * types.length)];
            let expr = "", result = 0;

            let a = Math.floor(Math.random() * 15) + 1;
            let b = Math.floor(Math.random() * 10) + 1;
            let c = Math.floor(Math.random() * 10) + 1;

            switch(type) {
                case 1:
                    expr = `${a} + (${b} × ${c})`;
                    result = a + (b * c);
                    break;
                case 2:
                    if(a < b) [a, b] = [b, a];
                    expr = `(${a} - ${b}) × ${c}`;
                    result = (a - b) * c;
                    break;
                case 3:
                    let d = Math.floor(Math.random() * 10) + 1;
                    expr = `${a} × (${b} + ${c}) - ${d}`;
                    result = (a * (b + c)) - d;
                    break;
            }
            return { expr, result };
        }

        function nextQuestion() {
            if (questionCount >= 5) {
                endGame();
                return;
            }
            questionCount++;
            document.getElementById('q-count').innerText = questionCount;
            
            const q = generateExpression();
            document.getElementById('math-expression').innerText = q.expr;
            currentAnswer = q.result;
            
            document.getElementById('answer-input').value = '';
            document.getElementById('answer-input').focus();

            clearInterval(timer);
            timeLeft = 30;
            updateTimerBar();
            timer = setInterval(() => {
                timeLeft--;
                updateTimerBar();
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    misses++; // Fallo por tiempo gastado
                    nextQuestion();
                }
            }, 1000);
        }

        function updateTimerBar() {
            const percentage = (timeLeft / 30) * 100;
            const bar = document.getElementById('timer-bar');
            bar.style.width = percentage + '%';
            bar.className = timeLeft > 10 
                ? "bg-green-500 h-2.5 rounded-full transition-all duration-1000" 
                : "bg-red-500 h-2.5 rounded-full transition-all duration-1000";
        }

        function submitAnswer(e) {
            e.preventDefault();
            clearInterval(timer);
            const userAns = parseFloat(document.getElementById('answer-input').value);

            if (userAns === currentAnswer) {
                hits++;
                const points = 100 + (timeLeft * 5);
                currentScore += points;
            } else {
                misses++;
            }

            nextQuestion();
        }

        function endGame() {
            document.getElementById('screen-game').classList.add('hidden');
            document.getElementById('screen-result').classList.remove('hidden');
            
            document.getElementById('round-score').innerText = `${currentScore} pts`;
            document.getElementById('round-hits').innerText = hits;
            document.getElementById('round-misses').innerText = misses;

            const todayIdx = getTodayIndex();
            const player = playersData[selectedPlayer];

            // Acumular totales históricos de aciertos y fallos
            player.hits += hits;
            player.misses += misses;

            // Comprobar si es el récord del día
            const previousBest = player.dailyScores[todayIdx];
            let isNewBest = false;
            if (currentScore > previousBest) {
                player.dailyScores[todayIdx] = currentScore;
                isNewBest = true;
            }

            document.getElementById('new-high-score-badge').classList.toggle('hidden', !isNewBest);

            saveData();
            updateLeaderboard();
        }

        function backToHome() {
            document.getElementById('screen-result').classList.add('hidden');
            document.getElementById('screen-home').classList.remove('hidden');
        }

        function updateLeaderboard() {
            const container = document.getElementById('leaderboard');
            container.innerHTML = '';

            const todayIdx = getTodayIndex();

            // Calcular puntos totales por jugador (suma de los 7 días)
            const sortedPlayers = Object.entries(playersData).map(([name, data]) => {
                const totalWeeklyScore = data.dailyScores.reduce((a, b) => a + b, 0);
                return { name, ...data, totalWeeklyScore };
            }).sort((a, b) => b.totalWeeklyScore - a.totalWeeklyScore);

            if (sortedPlayers.length === 0) {
                container.innerHTML = `<p class="text-xs text-gray-400 text-center py-2">Sin puntuaciones registradas.</p>`;
                return;
            }

            sortedPlayers.forEach((p, index) => {
                const medals = ['🥇', '🥈', '🥉'];
                const medal = medals[index] || '👤';

                // Generar cuadritos de los 7 días de la semana
                let daysHtml = p.dailyScores.map((score, idx) => {
                    const isToday = idx === todayIdx;
                    return `
                        <div class="flex flex-col items-center ${isToday ? 'font-bold text-indigo-700' : 'text-gray-400'}">
                            <span class="text-[10px]">${DAYS_OF_WEEK[idx]}</span>
                            <span class="text-xs px-1.5 py-0.5 rounded ${score > 0 ? (isToday ? 'bg-indigo-200 text-indigo-900' : 'bg-gray-100 text-gray-700') : 'bg-gray-50'}">${score}</span>
                        </div>
                    `;
                }).join('');

                const card = document.createElement('div');
                card.className = "bg-white p-3 rounded-xl shadow-sm space-y-2";
                card.innerHTML = `
                    <div class="flex justify-between items-center border-b border-gray-100 pb-2">
                        <span class="font-bold text-gray-800">${medal} ${p.name}</span>
                        <span class="font-black text-indigo-600 text-base">${p.totalWeeklyScore} pts</span>
                    </div>
                    
                    <!-- Desglose de los 7 días -->
                    <div class="grid grid-cols-7 gap-1 text-center">
                        ${daysHtml}
                    </div>

                    <!-- Estadísticas de aciertos/fallos -->
                    <div class="flex justify-between text-[11px] text-gray-500 pt-1">
                        <span>🎯 Aciertos: <strong class="text-green-600">${p.hits}</strong></span>
                        <span>❌ Fallos: <strong class="text-red-500">${p.misses}</strong></span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function saveData() {
            localStorage.setItem('math_family_v3', JSON.stringify(playersData));
        }

        function resetWeeklyScores() {
            if(confirm("¿Seguro que quieres reiniciar las puntuaciones diarias y estadísticas de esta semana?")) {
                Object.keys(playersData).forEach(name => {
                    playersData[name].dailyScores = [0, 0, 0, 0, 0, 0, 0];
                    playersData[name].hits = 0;
                    playersData[name].misses = 0;
                });
                saveData();
                updateLeaderboard();
            }
        }

        function clearAllData() {
            if(confirm("¿Borrar todos los jugadores y datos completamente?")) {
                playersData = {};
                selectedPlayer = null;
                document.getElementById('start-section').classList.add('hidden');
                saveData();
                renderPlayersList();
                updateLeaderboard();
            }
        }
    </script>
</body>
</html>
